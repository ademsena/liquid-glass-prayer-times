<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Liquid-glass squircle with the mint countdown accent -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c31"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glass)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- kicker label -->
  <rect x="46" y="56" width="52" height="6" rx="3" fill="#04e4b5" opacity="0.95"/>

  <!-- countdown digits, abstracted to bars so no font is needed -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="46"  y="88" width="16" height="40" rx="6"/>
    <rect x="68"  y="88" width="16" height="40" rx="6"/>
    <rect x="104" y="88" width="16" height="40" rx="6"/>
    <rect x="126" y="88" width="16" height="40" rx="6"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <rect x="90" y="98" width="7" height="7" rx="3.5"/>
    <rect x="90" y="113" width="7" height="7" rx="3.5"/>
    <rect x="148" y="98" width="7" height="7" rx="3.5"/>
    <rect x="148" y="113" width="7" height="7" rx="3.5"/>
  </g>
  <g fill="#04e4b5" opacity="0.9">
    <rect x="164" y="88" width="16" height="40" rx="6"/>
    <rect x="186" y="88" width="16" height="40" rx="6"/>
  </g>

  <!-- progress track + fill -->
  <rect x="46" y="150" width="164" height="8" rx="4" fill="#ffffff" opacity="0.18"/>
  <rect x="46" y="150" width="104" height="8" rx="4" fill="#04e4b5" opacity="0.92"/>

  <!-- prayer rows -->
  <g>
    <circle cx="52" cy="182" r="5" fill="#ffffff" opacity="0.45"/>
    <rect x="66" y="177" width="46" height="9" rx="4.5" fill="#ffffff" opacity="0.40"/>
    <rect x="176" y="177" width="34" height="9" rx="4.5" fill="#ffffff" opacity="0.30"/>

    <circle cx="52" cy="204" r="5" fill="#ffffff" opacity="0.45"/>
    <rect x="66" y="199" width="52" height="9" rx="4.5" fill="#ffffff" opacity="0.40"/>
    <rect x="176" y="199" width="34" height="9" rx="4.5" fill="#ffffff" opacity="0.30"/>
  </g>
</svg>
